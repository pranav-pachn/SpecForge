version: '3.8'

services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: specforge
      POSTGRES_PASSWORD: specforge_password
      POSTGRES_DB: specforge_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    volumes:
      - miniodata:/data

  # Single Node image that boots multiple BullMQ consumer processes
  worker:
    build: 
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://specforge:specforge_password@db:5432/specforge_db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - db
      - redis
      - minio

  # Root Next.js web application and API gateway
  web:
    build: 
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://specforge:specforge_password@db:5432/specforge_db
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redisdata:
  miniodata:
